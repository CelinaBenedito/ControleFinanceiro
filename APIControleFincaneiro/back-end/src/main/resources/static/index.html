<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/Estilos.css">
    <link href='assets/boxicons/boxicons.min.css' rel='stylesheet' id='bx-local'>
    <script>
        // Fallback: se icones locais nao carregarem, usa CDN
        (function(){
            function checkAndFallback(){
                var el = document.createElement('i');
                el.className = 'bx bx-check';
                el.style.cssText = 'position:fixed;top:-9999px;left:-9999px;font-size:20px;visibility:hidden';
                document.body.appendChild(el);
                var ff = window.getComputedStyle(el).fontFamily || '';
                document.body.removeChild(el);
                if(ff.toLowerCase().indexOf('boxicons') === -1){
                    var l = document.createElement('link');
                    l.rel = 'stylesheet';
                    l.href = 'https://cdn.boxicons.com/3.0.6/fonts/basic/boxicons.min.css';
                    document.head.appendChild(l);
                }
            }
            if(document.readyState === 'loading'){
                document.addEventListener('DOMContentLoaded', checkAndFallback);
            } else { checkAndFallback(); }
        })();
    </script>

    <title>Escolher perfil</title>
</head>

<body>
<div class="container">
    <div class="main" id="main">
        <div class="containerUsuarios">
            <div class="usuarios" id="listaUsuarios">
                <a href="cadastrar.html" title="Criar nova conta">
                <div class="addUsuario">
                    <i class="bx bx-plus"></i>
                </div>
                </a>
            </div>
        </div>
        <a href="login.html" style="align-self: center; color: var(--cor-texto-alternativo); text-decoration: none;" title="Fazer login">Login</a>
    </div>
</div>

<script src="js/main.js"></script>
<script>
    (async function () {
        const API = "http://localhost:8080";
        const lista = document.getElementById("listaUsuarios");
        const btnAdd = lista.querySelector(".addUsuario");

        // Carrega perfis: API (arquivo em disco) tem prioridade, localStorage é fallback.
        // Se a API retornar vazio mas localStorage tiver dados, usa localStorage
        // e salva no arquivo para sincronizar (útil na primeira execução com novo código).
        var perfis = [];
        var perfisDoArquivo = [];
        var perfisDoLocalStorage = [];

        try {
            var res = await fetch(API + "/perfis");
            if (res.ok) {
                var raw = await res.text();
                perfisDoArquivo = JSON.parse(raw || "[]");
            }
        } catch (e) {}

        try {
            perfisDoLocalStorage = JSON.parse(localStorage.getItem("perfis") || "[]");
        } catch (_) {}

        if (perfisDoArquivo.length > 0) {
            perfis = perfisDoArquivo;
        } else if (perfisDoLocalStorage.length > 0) {
            // Arquivo ainda não existe — usa localStorage e persiste no arquivo
            perfis = perfisDoLocalStorage;
            try {
                await fetch(API + "/perfis", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ perfis: JSON.stringify(perfis) })
                });
            } catch (e) {}
        }

        // Atualiza dados de cada perfil (imagem, nome, etc.) via API
        var perfisAtualizados = await Promise.all(
            perfis.map(async function(perfil) {
                try {
                    var r = await fetch(API + "/usuarios/" + perfil.id);
                    if (r.ok) {
                        var u = await r.json();
                        return Object.assign({}, perfil, u);
                    }
                } catch (e) {}
                return perfil;
            })
        );

        // Persiste lista atualizada no arquivo e no localStorage
        var perfisJson = JSON.stringify(perfisAtualizados);
        localStorage.setItem("perfis", perfisJson);
        try {
            await fetch(API + "/perfis", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ perfis: perfisJson })
            });
        } catch (e) {}

        function resolverImg(perfil) {
            if (!perfil.imagem) return null;
            if (/^data:image\//i.test(perfil.imagem) || /^https?:\/\//i.test(perfil.imagem)) return perfil.imagem;
            return API + (perfil.imagem.startsWith("/") ? perfil.imagem : "/" + perfil.imagem);
        }

        if (perfisAtualizados.length === 0) {
            var aviso = document.createElement("p");
            aviso.textContent = "Nenhum perfil salvo. Faça login ou cadastre-se.";
            aviso.style.cssText = "color: var(--text-muted, #888); font-size: 0.9rem; margin-bottom: 1rem;";
            lista.insertBefore(aviso, btnAdd);
            return;
        }

        perfisAtualizados.forEach(function(perfil) {
            var card = document.createElement("div");
            card.className = "usuario-card";

            var imgUrl = resolverImg(perfil);
            var imgFinal = imgUrl
                ? imgUrl + (imgUrl.includes("?") ? "&" : "?") + "v=" + Date.now()
                : null;

            var avatarHtml = imgFinal
                ? '<img src="' + imgFinal + '" alt="' + perfil.nome + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'\'"><i class="bx bx-user" style="display:none;"></i>'
                : '<i class="bx bx-user"></i>';

            card.innerHTML = '<div class="usuario">' + avatarHtml + '</div><span>' + perfil.nome + '</span>';
            card.style.cursor = "pointer";
            card.addEventListener("click", function() {
                localStorage.setItem("usuarioLogado", JSON.stringify(perfil));
                window.location.href = "dashboard.html";
            });
            lista.insertBefore(card, btnAdd);
        });
    })();
</script>
</body>

</html>
